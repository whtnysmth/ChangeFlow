<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChangeFlow — Q4 Platform Migration</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400..600&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Fredoka: the coach's voice — phase subtitles and coaching tips only */
      .font-fredoka { font-family: 'Fredoka', system-ui, sans-serif; }
      @media print {
        aside, .no-print { display: none !important; }
        body { background: #fff !important; }
        body * { color: #111 !important; border-color: #ddd !important; }
      }
      /* Neon active-tab border, matched to the hummingbird's blue-teal glow */
      .tab-neon {
        border: 1px solid rgba(56, 224, 255, 0.85);
        box-shadow:
          0 0 6px rgba(56, 189, 248, 0.9),
          0 0 16px rgba(34, 211, 238, 0.45),
          inset 0 0 12px rgba(34, 211, 238, 0.12);
      }
      /* Gentle hummingbird pulse: slight grow and shrink */
      @keyframes bird-pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.09); }
      }
      .bird-pulse {
        animation: bird-pulse 2.6s ease-in-out infinite;
        transform-origin: center;
      }
      /* Sidebar reorder drop indicator: insertion line above the target tab */
      .drop-target {
        box-shadow: 0 -3px 0 0 #38bdf8;
      }
    </style>
  </head>
  <body class="bg-slate-950 text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
