<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChangeFlow — Q4 Platform Migration</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400..600&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Fredoka: the coach's voice — phase subtitles and coaching tips only */
      .font-fredoka { font-family: 'Fredoka', system-ui, sans-serif; }
      /* Slate-midnight metric cards (Whitney's pick, shade 1): a half-step down
         from the coach-tip popup — same midnight family, no outer neon glow
         (the glow stays the popup's signature). Descendant overrides remap the
         light-card text/track colors used inside the shared Card wrapper. */
      .midnight-card {
        background: linear-gradient(135deg, #16283f 0%, #1d3554 60%, #173a4d 100%);
        border: 1px solid rgba(148,184,220,0.28);
        box-shadow: 0 10px 26px rgba(10,25,45,0.35);
        border-radius: 0.75rem;
        padding: 1.25rem;
      }
      .midnight-card .text-slate-900 { color: #f1f5f9 !important; }
      .midnight-card .text-slate-800 { color: #e8eef6 !important; }
      .midnight-card .text-slate-700 { color: #c6d8ec !important; }
      .midnight-card .text-slate-600 { color: #a9c3de !important; }
      .midnight-card .text-slate-500 { color: #93a9c4 !important; }
      .midnight-card .text-slate-400 { color: #7d99b8 !important; }
      .midnight-card .text-slate-300 { color: #7d99b8 !important; }
      .midnight-card .text-\[\#0060c9\] { color: #7dd3fc !important; }
      .midnight-card .text-amber-600 { color: #fbbf24 !important; }
      .midnight-card .bg-slate-200 { background-color: rgba(148,184,220,0.16) !important; }
      .midnight-card .bg-slate-100 { background-color: rgba(148,184,220,0.12) !important; }
      .midnight-card .bg-amber-500 { background-color: #f59e0b !important; }
      .midnight-card .border-slate-200 { border-color: rgba(148,184,220,0.2) !important; }
      /* Dashboard home: thin neon borders on the midnight cards. Glow kept
         subtler than the coach-tip popup's so the popup stays the brightest
         neon in the room. Scope with .neon-frame on the dashboard root. */
      .neon-frame .midnight-card {
        border: 1px solid rgba(56,224,255,0.5);
        box-shadow: 0 10px 26px rgba(10,25,45,0.35), 0 0 10px rgba(56,189,248,0.15);
      }
      /* Dark mode (toggle in sidebar Settings). Remaps the light-theme surfaces;
         midnight cards, coach popup, and sidebar are already dark and untouched. */
      html.dark { color-scheme: dark; }
      html.dark .bg-\[\#edf1f7\] { background-color: #0a1220 !important; }
      html.dark .bg-white { background-color: #101c33 !important; }
      html.dark .bg-slate-50 { background-color: #0d1728 !important; }
      html.dark .bg-slate-100 { background-color: rgba(148,184,220,0.10) !important; }
      html.dark .bg-slate-200 { background-color: rgba(148,184,220,0.14) !important; }
      html.dark .text-slate-900 { color: #f1f5f9 !important; }
      html.dark .text-slate-800 { color: #e8eef6 !important; }
      html.dark .text-slate-700 { color: #c6d8ec !important; }
      html.dark .text-slate-600 { color: #a9c3de !important; }
      html.dark .text-slate-500 { color: #93a9c4 !important; }
      html.dark .border-slate-200 { border-color: rgba(148,184,220,0.16) !important; }
      html.dark .border-slate-300 { border-color: rgba(148,184,220,0.25) !important; }
      html.dark .text-\[\#0060c9\] { color: #7dd3fc !important; }
      html.dark .shadow-sm { box-shadow: 0 4px 14px rgba(0,0,0,0.35) !important; }
      @media print {
        aside, .no-print { display: none !important; }
        body { background: #fff !important; }
        body * { color: #111 !important; border-color: #ddd !important; }
      }
      /* Neon active-tab border, matched to the hummingbird's blue-teal glow */
      .tab-neon {
        border: 1px solid rgba(56, 224, 255, 0.85);
        box-shadow:
          0 0 6px rgba(56, 189, 248, 0.9),
          0 0 16px rgba(34, 211, 238, 0.45),
          inset 0 0 12px rgba(34, 211, 238, 0.12);
      }
      /* Gentle hummingbird pulse: slight grow and shrink */
      @keyframes bird-pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.09); }
      }
      .bird-pulse {
        animation: bird-pulse 2.6s ease-in-out infinite;
        transform-origin: center;
      }
      /* Sidebar reorder drop indicator: insertion line above the target tab */
      .drop-target {
        box-shadow: 0 -3px 0 0 #38bdf8;
      }
    </style>
  </head>
  <body class="bg-slate-950 text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
